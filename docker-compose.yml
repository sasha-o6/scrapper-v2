services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_monitor
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telegram_monitor?schema=public
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      PORT: 3000
      QUEUE_INTERVAL_MS: 4000
      JOIN_INTERVAL_MS: ${JOIN_INTERVAL_MS:-4000}
      ALLOW_DEV_AUTH: "false"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    ports:
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      app:
        condition: service_started
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  postgres_data:
